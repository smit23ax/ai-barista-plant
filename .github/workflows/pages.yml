# Build the submission website (site_src/) and publish it to GitHub Pages on every push to main.
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt pytest
      - run: npm ci --prefix docs
      - run: python -m pytest -q tests/test_site.py
      - run: python site_src/build.py
        env:
          PYTHONPATH: .
          FINAL: ${{ vars.FINAL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
